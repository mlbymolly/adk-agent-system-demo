[project]
name = "adk-agent-system-demo"
version = "2.0.0"
description = "Multi-agent system for task management, weather, and date queries using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "mcp[cli]",
    "docker>=7.1.0",
    "anthropic>=0.84.0",
    "litellm>=1.82.0",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

